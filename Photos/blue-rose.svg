<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" class="blue-rose-svg">
  <defs>
    <!-- Petal Main Royal Blue Gradient -->
    <linearGradient id="roseBlueMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="35%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Petal Deep Velvet Shadow -->
    <linearGradient id="roseBlueDark" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="60%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>

    <!-- Petal Soft Sky Glow Highlight -->
    <linearGradient id="roseBlueGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>

    <!-- Petal Lip Rim Highlight -->
    <linearGradient id="roseBlueLip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <!-- Fresh Botanic Stem Gradient -->
    <linearGradient id="roseStemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Leaf Gradient -->
    <linearGradient id="roseLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>

    <!-- Soft Depth Filter -->
    <filter id="roseDropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#1e40af" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Green Stem -->
  <path d="M32 35 C32 42, 31.5 50, 32 58" stroke="url(#roseStemGrad)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Leaf branching to the right -->
  <path d="M32 46 C36 43, 44 41, 48 44 C49 46, 48.5 49, 45 51 C40 53, 35 50, 32 48 Z" fill="url(#roseLeafGrad)"/>
  <path d="M33 47 Q40 46 47 44.5" stroke="#15803d" stroke-width="0.9" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Sepal (Green Calyx at base of petals) -->
  <path d="M26 35 C28 38, 31 39, 32 39 C33 39, 36 38, 38 35 C35 33, 29 33, 26 35 Z" fill="url(#roseStemGrad)"/>
  <path d="M24 33 C25 36.5, 23 38.5, 21 39 C23 37, 25 34.5, 26 33 Z" fill="url(#roseStemGrad)"/>
  <path d="M40 33 C39 36.5, 41 38.5, 43 39 C41 37, 39 34.5, 38 33 Z" fill="url(#roseStemGrad)"/>

  <!-- Blooming Blue Rose Petals -->
  <g filter="url(#roseDropGlow)">
    <!-- Back Deep Petals -->
    <path d="M23 18 C23 9, 32 7, 32 7 C32 7, 41 9, 41 18 C41 25.5, 37 32, 32 35 C27 32, 23 25.5, 23 18 Z" fill="url(#roseBlueDark)"/>

    <!-- Inner Core Petals (Swirl) -->
    <path d="M27.5 16 C27.5 11, 32 9.5, 33 9.5 C36.5 9.5, 37.5 12.5, 36.5 16 C35.5 18.5, 32 20.5, 30 20.5 C28 20.5, 27.5 18.5, 27.5 16 Z" fill="url(#roseBlueMain)"/>
    <path d="M30 14 C31 11.5, 34 11.5, 34.5 12.5 C34.5 13.8, 33.2 15, 32 15 C30.8 15, 30 14.5, 30 14 Z" fill="url(#roseBlueLip)"/>

    <!-- Left Petal Wrap -->
    <path d="M20.5 17 C18.5 22.5, 20.5 29, 25.5 33.5 C28 31.5, 27 25, 25 20 C23.8 17, 21.8 15.5, 20.5 17 Z" fill="url(#roseBlueMain)"/>
    <path d="M20.5 17 C20.5 13.5, 24.5 12, 28 14.5 C25 15.8, 23 18.5, 22 23 C20.8 20.5, 20.5 18, 20.5 17 Z" fill="url(#roseBlueGlow)" opacity="0.95"/>

    <!-- Right Petal Wrap -->
    <path d="M43.5 17 C45.5 22.5, 43.5 29, 38.5 33.5 C36 31.5, 37 25, 39 20 C40.2 17, 42.2 15.5, 43.5 17 Z" fill="url(#roseBlueMain)"/>
    <path d="M43.5 17 C43.5 13.5, 39.5 12, 36 14.5 C39 15.8, 41 18.5, 42 23 C43.2 20.5, 43.5 18, 43.5 17 Z" fill="url(#roseBlueGlow)" opacity="0.95"/>

    <!-- Front Petal Cup (Bottom Center) -->
    <path d="M22.5 20.5 C22.5 29, 26.5 35, 32 36 C37.5 35, 41.5 29, 41.5 20.5 C38 23.5, 34 25, 32 25 C30 25, 26 23.5, 22.5 20.5 Z" fill="url(#roseBlueMain)"/>

    <!-- Front Petal Upper Rim -->
    <path d="M23.5 21.5 C26.8 24.2, 29.8 25.3, 32 25.3 C34.2 25.3, 37.2 24.2, 40.5 21.5 C37.5 25.8, 33.5 27, 32 27 C30.5 27, 26.5 25.8, 23.5 21.5 Z" fill="url(#roseBlueLip)" opacity="0.85"/>

    <!-- Subtle Petal Edge Light Contour -->
    <path d="M21 18 C24 22, 26.5 29, 32 34 C37.5 29, 40 22, 43 18" stroke="url(#roseBlueLip)" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>
</svg>
